[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seq2pwm"
version = "0.1.0"
description = "Predict DNA-binding motif probability matrices from transcription-factor sequences"
readme = "README.md"
license = {file = "LICENSE.txt"}
requires-python = ">=3.10,<3.12"
authors = [
  {name = "Junchen Luo"},
  {name = "Yunzhi Lang"},
  {name = "Zhi Wang"},
  {name = "Xiaoliang Sunney Xie"},
  {name = "Mingchen Chen", email = "mingchenchen@cpl.ac.cn"},
]
keywords = [
  "transcription factor",
  "DNA-binding specificity",
  "protein language model",
  "motif prediction",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "torch==2.3.1",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "tqdm==4.66.4",
  "fair-esm==2.0.0",
  "matplotlib==3.9.1",
  "logomaker==0.8",
]

[project.scripts]
seq2pwm-predict = "seq2pwm.cli.predict:main"
seq2pwm-embed = "seq2pwm.cli.embed:main"

[project.urls]
Homepage = "https://github.com/Mingchenchen/Seq2PWM"
Repository = "https://github.com/Mingchenchen/Seq2PWM"
Issues = "https://github.com/Mingchenchen/Seq2PWM/issues"

[project.optional-dependencies]
full = [
  "scipy==1.13.1",
  "scikit-learn==1.5.1",
  "seaborn==0.13.2",
  "PyYAML==6.0.1",
  "tensorboard==2.17.0",
  "umap-learn==0.5.6",
]
test = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
