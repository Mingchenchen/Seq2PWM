# Shared configuration for folds 0-9; select a fold with --fold.
data:
  train_tf_data: fold_{fold}_train.csv
  valid_data: fold_{fold}_val.csv
  test_data: fold_{fold}_test.csv
  # Rank 0 creates or repairs this cache from train, validation, and test.
  esm_cache_path: runs/ten_fold/fold_{fold}/esm_cache/all_sequences.pt
  esm_model_cache: .cache/esm
    
training:
  batch_size: 96
  save_dir: runs/ten_fold/fold_{fold}
  seed: 42
  epochs: 300
  learning_rate: 0.0001
  weight_decay: 0.01
  weights: null

loss_weights:
  jsd_loss: 1.0
  bg_reg_loss: 0.2

aux_loss_weights:
  dbd_class_loss: 0.01
  contrastive_loss: 0.1

contrastive:
  temperature: 0.1
